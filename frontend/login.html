<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — AI School</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-page">
      <!-- Bên trái: ảnh / branding (ẩn trên điện thoại) -->
      <div class="login-panel-left">
        <div class="slider">
          <div class="slide active">
            <img src="images/truong.jfif" alt="" />
          </div>
        </div>

        <div class="login-panel-left__overlay"></div>

        <div class="login-panel-left__content">
          <div class="login-panel-left__icon">
            <i class="fa-solid fa-school"></i>
          </div>
          <h2>AI School</h2>
          <p>Hệ thống AI quản lý học sinh thông minh</p>
          <div class="login-panel-left__dots" id="dots"></div>
        </div>
      </div>

      <!-- Bên phải: form đăng nhập -->
      <div class="login-panel-right">
        <div class="login-logo-mini">
          <i class="fa-solid fa-school"></i>
          <span>AI School</span>
        </div>

        <div class="login-card">
          <h1>Chào mừng trở lại</h1>
          <p class="login-subtitle">Đăng nhập để tiếp tục</p>

          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-user input-icon"></i>
              <input
                type="text"
                id="username"
                placeholder="Nhập username"
                onkeydown="if (event.key === 'Enter') document.getElementById('password').focus();"
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Mật khẩu</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                onkeydown="if (event.key === 'Enter') login();"
              />
              <button type="button" class="pw-toggle" aria-label="Hiện/ẩn mật khẩu"
                onclick="const p=document.getElementById('password'),h=p.type==='password';p.type=h?'text':'password';this.firstElementChild.className='fa-solid '+(h?'fa-eye-slash':'fa-eye')"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>

          <button id="loginBtn" onclick="login()">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
          </button>

          <p id="loginMessage"></p>
        </div>

        <p class="login-footer">AI School</p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
    <script>
      // Slider ảnh bên trái: ảnh nào không tải được thì bỏ khỏi vòng lặp
      document.querySelectorAll(".slide img").forEach((img) => {
        img.addEventListener("error", () => img.closest(".slide").remove());
      });
      window.addEventListener("load", () => {
        const slides = [...document.querySelectorAll(".slide")];
        const dotsBox = document.getElementById("dots");
        dotsBox.innerHTML = slides.map((_, i) => `<span class="dot${i ? "" : " dot--active"}"></span>`).join("");
        if (!slides.length) return;
        slides[0].classList.add("active");
        if (slides.length < 2) return;
        const dots = [...dotsBox.children];
        let current = 0;
        setInterval(() => {
          slides[current].classList.remove("active");
          dots[current].classList.remove("dot--active");
          current = (current + 1) % slides.length;
          slides[current].classList.add("active");
          dots[current].classList.add("dot--active");
        }, 5000);
      });
    </script>
  </body>
</html>
